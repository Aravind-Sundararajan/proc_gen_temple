# Lint and test on the three desktop platforms, then build the PyInstaller folder on each and
# keep it as an artifact; a tag v* turns the three folders into a GitHub release.
#
# The build job calls the same devtool verbs a developer runs (`devtool build` draws the icons,
# runs PyInstaller and smoke-tests the folder), so the pipeline and the desk agree on what a
# build is.  The smoke test renders a screenshot through the bundled editor, which needs a GL
# context: Xvfb with Mesa on Linux, Qt's software rasteriser on Windows, the desktop on macOS.
name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  # Qt on a Linux runner: the xcb platform plugin and Mesa's software GL for the smoke test.
  APT_QT: >-
    libegl1 libgl1 libopengl0 libgl1-mesa-dri libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3
    libfontconfig1 libglib2.0-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1
    libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-xfixes0
    libxcb-xinerama0 libxcb-xkb1 xvfb

jobs:
  check:
    name: lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends $APT_QT

      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Poetry
        run: pipx install poetry

      - name: Cache the virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}

      - name: Install
        run: poetry install --with build --no-interaction

      - name: Lint
        run: poetry run ruff check mandapa tests tools

      - name: Test
        run: poetry run pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  bundle:
    name: bundle (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends $APT_QT

      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Poetry
        run: pipx install poetry

      - name: Cache the virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}

      - name: Install
        run: poetry install --with build --no-interaction

      - name: The licence texts are committed
        shell: bash
        run: |
          for f in licenses/LGPL-3.0.txt licenses/GPL-3.0.txt; do
            test -s "$f" || { echo "::error file=$f::missing; run ./devtool.sh licenses and commit licenses/"; exit 1; }
          done

      - name: Build and smoke-test (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./devtool.sh build

      - name: Build and smoke-test (macOS)
        if: runner.os == 'macOS'
        run: ./devtool.sh build

      - name: Build and smoke-test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: .\devtool.bat build

      - name: Package
        shell: bash
        run: |
          mkdir -p release
          stem="proc_gen_temple-${GITHUB_REF_NAME//\//-}"
          case "${{ runner.os }}" in
            Linux)   tar -C dist -czf "release/$stem-linux-$(uname -m).tar.gz" proc_gen_temple ;;
            macOS)   ditto -c -k --sequesterRsrc --keepParent "dist/Mandapa Generator.app" "release/$stem-macos-$(uname -m).zip" ;;
            Windows) 7z a -tzip "release/$stem-windows-x64.zip" ./dist/proc_gen_temple > /dev/null ;;
          esac
          ls -l release

      - uses: actions/upload-artifact@v4
        with:
          name: proc_gen_temple-${{ matrix.os }}
          path: release/*
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
