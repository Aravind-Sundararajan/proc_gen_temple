[project]
name = "proc-gen-temple"
version = "0.1.0"
description = "Parametric generator for a Dravidian mandapa (pillared pavilion) that exports 3D-printable STL"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "numpy>=2.2",
    "trimesh>=5.0",
    "manifold3d>=3.5",
    "PySide6>=6.10",
    "pyqtgraph>=0.14",
    "PyOpenGL>=3.1.10",
]

[project.scripts]
temple-gen = "mandapa.gui.app:main"
mandapa = "mandapa.cli:main"

[tool.poetry]
packages = [{ include = "mandapa" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3"
ruff = ">=0.8"


[tool.poetry.group.build.dependencies]
pyinstaller = "^6.22.2"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
